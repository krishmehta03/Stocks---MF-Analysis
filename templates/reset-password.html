<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Portfolio Analysis</title>
  <meta name="description" content="Reset your Portfolio Analysis account password.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-page">

  <div class="auth-card">
    <!-- Logo -->
    <a href="/" class="auth-logo">
      <i class="fa-solid fa-chart-line"></i>
      <span>Portfolio Analysis</span>
    </a>

    <!-- ═══ STATE 1: Request Reset (no token) ═══ -->
    <div id="state-request">
      <div class="auth-icon-large" style="margin-left: 0;">
        <i class="fa-solid fa-lock"></i>
      </div>

      <h1 class="auth-heading">Reset your password</h1>
      <p class="auth-subheading">Enter your email and we'll send you a reset link.</p>

      <div id="request-alert" class="auth-alert"></div>

      <form id="request-form" novalidate>
        <div class="auth-form-group">
          <label for="reset-email">Email Address</label>
          <input type="email" id="reset-email" class="auth-input" placeholder="rahul@example.com" required>
          <div class="auth-field-error" id="err-email"></div>
        </div>

        <button type="submit" class="auth-btn-primary" id="btn-request">
          <span class="auth-btn-text">Send Reset Link</span>
          <span class="auth-spinner"></span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.25rem;">
        <a href="/login" class="auth-back-link" style="justify-content: center;">
          <i class="fa-solid fa-arrow-left"></i> Back to Sign In
        </a>
      </div>
    </div>

    <!-- ═══ STATE 2: Set New Password (token present) ═══ -->
    <div id="state-update" style="display: none;">
      <div class="auth-icon-large" style="margin-left: 0;">
        <i class="fa-solid fa-key"></i>
      </div>

      <h1 class="auth-heading">Set new password</h1>
      <p class="auth-subheading">Choose a new password for your account.</p>

      <div id="update-alert" class="auth-alert"></div>

      <form id="update-form" novalidate>
        <div class="auth-form-group">
          <label for="new-password">New Password</label>
          <div class="auth-input-wrap">
            <input type="password" id="new-password" class="auth-input" placeholder="Min. 8 characters" required minlength="8" style="padding-right: 40px;">
            <button type="button" class="auth-password-toggle" onclick="togglePw('new-password', this)" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="auth-password-hint"><i class="fa-solid fa-circle-info"></i> Min. 8 characters with at least 1 number</div>
          <div class="auth-field-error" id="err-new-pw"></div>
        </div>

        <div class="auth-form-group">
          <label for="confirm-password">Confirm Password</label>
          <div class="auth-input-wrap">
            <input type="password" id="confirm-password" class="auth-input" placeholder="Re-enter password" required style="padding-right: 40px;">
            <button type="button" class="auth-password-toggle" onclick="togglePw('confirm-password', this)" aria-label="Toggle password visibility">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <div class="auth-field-error" id="err-confirm-pw"></div>
        </div>

        <button type="submit" class="auth-btn-primary" id="btn-update">
          <span class="auth-btn-text">Update Password</span>
          <span class="auth-spinner"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = '{{ supabase_url }}';
    const SUPABASE_ANON_KEY = '{{ supabase_anon_key }}';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* ── Detect token in URL ─────────────── */
    (function detectState() {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const accessToken = hashParams.get('access_token');
      const type = hashParams.get('type');

      if (accessToken || type === 'recovery') {
        document.getElementById('state-request').style.display = 'none';
        document.getElementById('state-update').style.display = 'block';
      }
    })();

    /* ── Password toggle ─────────────────── */
    function togglePw(inputId, btn) {
      const inp = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.className = 'fa-solid fa-eye-slash';
      } else {
        inp.type = 'password';
        icon.className = 'fa-solid fa-eye';
      }
    }

    /* ── Helpers ──────────────────────────── */
    function showFieldError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('visible');
      const input = el.closest('.auth-form-group')?.querySelector('.auth-input');
      if (input) input.classList.add('input-error');
    }

    function clearFieldErrors(formId) {
      const form = document.getElementById(formId);
      form.querySelectorAll('.auth-field-error').forEach(el => {
        el.textContent = '';
        el.classList.remove('visible');
      });
      form.querySelectorAll('.auth-input').forEach(el => el.classList.remove('input-error'));
    }

    function showAlert(alertId, msg, type) {
      const alert = document.getElementById(alertId);
      alert.className = `auth-alert auth-alert-${type} visible`;
      alert.innerHTML = `<i class="fa-solid fa-${type === 'error' ? 'circle-xmark' : 'circle-check'}"></i> ${msg}`;
    }

    function clearAlert(alertId) {
      const alert = document.getElementById(alertId);
      alert.className = 'auth-alert';
      alert.textContent = '';
    }

    function setLoading(btnId, on) {
      const btn = document.getElementById(btnId);
      const form = btn.closest('form');
      const inputs = form.querySelectorAll('.auth-input');
      if (on) {
        btn.classList.add('loading');
        btn.disabled = true;
        inputs.forEach(i => i.disabled = true);
      } else {
        btn.classList.remove('loading');
        btn.disabled = false;
        inputs.forEach(i => i.disabled = false);
      }
    }

    /* ═══ STATE 1: Request Reset ═══════════ */
    document.getElementById('request-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearFieldErrors('request-form');
      clearAlert('request-alert');

      const email = document.getElementById('reset-email').value.trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!email) { showFieldError('err-email', 'Email is required'); return; }
      if (!emailRegex.test(email)) { showFieldError('err-email', 'Please enter a valid email address'); return; }

      setLoading('btn-request', true);

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/reset-password'
        });

        // Always show success (security — don't reveal if email exists)
        showAlert('request-alert',
          "If an account exists with this email, you'll receive a reset link shortly.",
          'success'
        );

        // Disable re-submission for a moment
        setTimeout(() => setLoading('btn-request', false), 3000);
      } catch (err) {
        showAlert('request-alert',
          "If an account exists with this email, you'll receive a reset link shortly.",
          'success'
        );
        setTimeout(() => setLoading('btn-request', false), 3000);
      }
    });

    /* ═══ STATE 2: Update Password ═════════ */
    document.getElementById('update-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearFieldErrors('update-form');
      clearAlert('update-alert');

      const newPw = document.getElementById('new-password').value;
      const confirmPw = document.getElementById('confirm-password').value;

      let valid = true;

      if (!newPw) { showFieldError('err-new-pw', 'Password is required'); valid = false; }
      else if (newPw.length < 8) { showFieldError('err-new-pw', 'Password must be at least 8 characters'); valid = false; }
      else if (!/\d/.test(newPw)) { showFieldError('err-new-pw', 'Password must contain at least 1 number'); valid = false; }

      if (!confirmPw) { showFieldError('err-confirm-pw', 'Please confirm your password'); valid = false; }
      else if (newPw !== confirmPw) { showFieldError('err-confirm-pw', 'Passwords do not match'); valid = false; }

      if (!valid) return;

      setLoading('btn-update', true);

      try {
        const { error } = await supabase.auth.updateUser({
          password: newPw
        });

        if (error) {
          showAlert('update-alert',
            'Failed to update password. Your reset link may have expired. <a href="/reset-password" style="color:inherit;text-decoration:underline;">Request a new one.</a>',
            'error'
          );
          setLoading('btn-update', false);
          return;
        }

        // Success — redirect to login with success message
        window.location.href = '/login?reset=success';
      } catch (err) {
        showAlert('update-alert',
          'Failed to update password. Your reset link may have expired. <a href="/reset-password" style="color:inherit;text-decoration:underline;">Request a new one.</a>',
          'error'
        );
        setLoading('btn-update', false);
      }
    });
  </script>
</body>
</html>
